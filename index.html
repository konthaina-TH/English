["Comparatives & superlatives","Short adjectives add -er/-est; long ones use more/most. Never double (more cheaper). Two things = comparative (the second is the more realistic); three or more = superlative. “One of the” + plural noun. Keep as…as complete.","✗ as fast, if not faster than ✓ as fast as, if not faster than"],
["Faulty comparison","Compare like with like. Use “that of / those of” to avoid comparing a thing with a place or person.","✗ population of Bangkok is larger than Chiang Mai ✓ …than that of Chiang Mai"],
["Conditionals & subjunctive","Type 2: if + past, would + V. Type 3: if + had V3, would have V3. Never put “would” in the if-clause. Unless already means “if not,” so no extra negative. After insist, demand, recommend, suggest use the base form (that he be…). “It’s high time” + past tense.","✗ If I would have known ✓ If I had known · ✗ Unless you don’t hurry ✓ Unless you hurry"],
["Gerunds, infinitives & causatives","Enjoy, suggest, avoid, prohibit from + gerund. Look forward to, committed to, object to take gerunds because “to” is a preposition. Make/let + bare infinitive. Have + object + V3 = service.","✗ suggested to take ✓ suggested taking · ✗ had my car repair ✓ had my car repaired"],
["Quantifiers & uncountable nouns","Many/few/number + countable; much/little/amount + uncountable. Advice, information, furniture, news are uncountable: no “a” or plural.","✗ an advice ✓ a piece of advice · ✗ Much of the students ✓ Many of the students"],
["Relative clauses","Who (people, subject), whom (people, object), which/that (things), whose (possession). In “the man who I think is…,” who is the subject of “is,” so not whom.","✗ The scientist whom the committee believed was responsible ✓ who…"],
["Passive voice","Passive = be + past participle. Check the participle form and the right form of be.","✗ is being build ✓ is being built"],
["Connectors & redundancy","Do not use two connectors for one link (Although…but). Avoid “reason…because”; use “reason…that.”","✗ Although tired, but he worked ✓ Although tired, he worked"],
["Modal verbs","Modals take the bare infinitive. Past modals: could/should/must + have + V3.","✗ should to see ✓ should see · ✗ could have win ✓ could have won"],
["Inversion","After negative or restrictive openers (not only, hardly…when, no sooner…than, little, seldom, only after), put the auxiliary before the subject. Hardly pairs with “when.”","✗ Not only she was late ✓ Not only was she late"],
["Dangling modifiers","An opening participle phrase must describe the subject of the main clause.","✗ Having studied all night, the exam seemed easy. ✓ …Mia found the exam easy."],
["Reported speech","Use statement word order and shift tenses back (will → would). No “did” in reported questions.","✗ asked where did I live ✓ asked where I lived"],
["So / such","So + adjective; such + (a) + adjective + noun.","✗ so beautiful day ✓ such a beautiful day"]
];
function guide(){return `<h2>Study guide</h2><p class="mut">Rules for every topic in the questions. Tap to open.</p>`+G.map(g=>`<details class="card"><summary>${g[0]}</summary><p>${g[1]}</p><p class="mut">${g[2].replace(/✗([^✓·]*)/g,'<span class="no">✗$1</span>').replace(/✓([^·]*)/g,'<span class="yes">✓$1</span>')}</p></details>`).join("")}
function home(){app.innerHTML=`<h1>Error Detection Test</h1><p class="mut">CU-TEP style. Pick the underlined part (A–D) that contains the error. An explanation appears after each answer.</p>
<button class="lv" onclick="start('normal')"><b>Normal</b><span class="mut">${D.normal.length} questions · standard grammar errors</span></button>
<button class="lv" onclick="start('hard')"><b>Extremely hard</b><span class="mut">${D.hard.length} questions · inversion, subjunctive, dangling modifiers, faulty comparison</span></button>
${guide()}`}
function start(l){L=l;i=0;score=0;miss=[];show()}
function show(){const Q=D[L];if(i>=Q.length)return end();const[t,s,a]=Q[i];const p=s.split(/\{\{|\}\}/);let h="",k=0;
p.forEach((x,n)=>{if(n%2){h+=`<button class="seg" data-k="${k}" onclick="pick(${k})"><sup>${"ABCD"[k]}</sup>${x}</button>`;k++}else h+=x});
app.innerHTML=`<div class="row mut"><span>${L==="hard"?"Extremely hard":"Normal"} · ${i+1}/${Q.length}</span><span>Score ${score}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
<div class="card"><span class="tag">${t}</span><p class="q">${h}</p><div id="fb"></div></div>`}
function pick(c){const[t,s,a,e]=D[L][i];document.querySelectorAll(".seg").forEach(b=>{b.disabled=true;const k=+b.dataset.k;if(k===a)b.classList.add("right");else if(k===c)b.classList.add("wrong")});
const ok=c===a;if(ok)score++;else miss.push(t);
$("#fb").innerHTML=`<div class="exp ${ok?"g":"b"}"><b>${ok?"Correct!":"Not quite."}</b> The error is in <b>(${"ABCD"[a]})</b>. ${e}</div><button class="pri" onclick="i++;show()">${i+1<D[L].length?"Next question →":"See results"}</button>`}
function end(){const n=D[L].length,u=[...new Set(miss)];app.innerHTML=`<h1>Results</h1><div class="card"><p style="font-size:2rem;margin:0">${score} / ${n}</p><p class="mut">${Math.round(score/n*100)}% correct</p>${u.length?`<p><b>Review these topics:</b><br>${u.join(" · ")}</p>`:"<p>Perfect score!</p>"}</div><button class="pri" onclick="start(L)">Retry</button> <button class="pri" style="background:var(--mut)" onclick="home()">Change level</button>`}
home();
</script></body></html>
